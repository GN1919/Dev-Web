<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>E-Commerce</title>

</head>

<!--Header-->

<body>
   <header>
      <div class="topo-header">
         <div class="conteudo">
            <ul class="redes sociais do header">
               <li>
                  <a href="#" class="link das redes-sociais">
                     <ion-icon name="logo-facebook"></ion-icon>
                  </a>
               </li>

               <li>
                  <a href="#" class="link das redes-sociais">
                     <ion-icon name="logo-instagram"></ion-icon>
                  </a>
               </li>

            </ul>

            <div class="acoes-header">
               <select name="idioma">
                  <option value="pt">Português</option>
                  <option value="en-US">Inglês</option>

               </select>

            </div>


         </div>
      </div>

      <div class="main-header">
         <div class="conteudo">
            <a href="#" class="logo-header">
               <img src="img/logo.jpeg" alt="logo do header" width="120" height="36">
            </a>

            <div class="barra-pesquisa-header">
               <input type="search" name="search" class="campo-pesquisa" placeholder="Pesquise o seu produto">
               <button class="botao-pesquisa">
                  <ion-icon name="search-outline"></ion-icon>
               </button>
            </div>

            <div class="acoes-usuario">
               <button class="acao-botao-usuario">
                  <ion-icon name="person-outline"></ion-icon>
               </button>

               <button class="acao-botao-usuario">
                  <ion-icon name="cart-outline"></ion-icon>
                  <span class="count">0</span>
               </button>

                <button class="acao-botao-usuario">
                 <p>ENTRAR</p>
               </button>

                <button class="acao-botao-usuario" >
                  <p>CADASTRAR-SE</p>
               </button>



            </div>
         </div>
      </div>

      <nav class="menunavegacao-ktop">
         <div class="conteudo">
            <ul class="categorias-menu">

               <li class="menu-categorias">
                  <a href="#" class="menu-titulo">Loja</a>
               </li>

            </ul>
            <ul>
               <li class="menu-categoria">
                  <a href="#" class="menu-titulo">PAPELARIA</a>
               </li>
            </ul>


            <ul>
               <li class="menu-categoria">
                  <a href="#" class="menu-titulo">INFORMÁTICA</a>

                  <div class="menu-informatica">
                     <ul class="menu-menu-informatica">
                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Computadores e laptops</a>
                        </li>

                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Tabletes</a>
                        </li>

                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Impressoras</a>

                        </li>
                        <li class="menu-categoria">
                           <a href="#">
                              <img src="img/impressora.jpeg" alt="imagem de impressora" width="250" height="119">
                           </a>
                        </li>
                     </ul>
            </ul>
         </div>
         </li>

         <ul>
            <li class="menu-categoria">
               <a href="#" class="menu-titulo">ASSISTENCIA TÉCNICA</a>
            </li>
         </ul>
         </div>

      </nav>



      <nav class="mobile-menunavegacao-ktop">
         <div class="conteudo">
            <ul class="categorias-menu">

               <li class="menu-categorias">
                  <a href="#" class="menu-titulo">Loja</a>
               </li>

            </ul>
            <ul>
               <li class="menu-categoria">
                  <a href="#" class="menu-titulo">PAPELARIA</a>
               </li>
            </ul>


            <ul>
               <li class="menu-categoria">
                  <a href="#" class="menu-titulo">INFORMÁTICA</a>

                  <div class="menu-informatica">
                     <ul class="menu-menu-informatica">
                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Computadores e laptops</a>
                        </li>

                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Tabletes</a>
                        </li>

                        <li class="menu-categoria">
                           <a href="#" class="menu-titulo">Impressoras</a>

                        </li>
                        <li class="menu-categoria">
                           <a href="#">
                              <img src="img/impressora.jpeg" alt="imagem de impressora" width="250" height="119">
                           </a>
                        </li>
                     </ul>
            </ul>
         </div>
         </li>

         <ul>
            <li class="menu-categoria">
               <a href="#" class="menu-titulo">ASSISTENCIA TÉCNICA</a>
            </li>
         </ul>
         </div>

      </nav>

      <div class="barra-nav-mobile">
         <button class="acao-botao-usuario">
            <ion-icon name="menu-outline"></ion-icon>
         </button>

         <button class="acao-botao-usuario">
            <ion-icon name="person-outline"></ion-icon>
         </button>

         <button class="acao-botao-usuario">
            <ion-icon name="cart-outline"></ion-icon>
            <span class="count">0</span>
         </button>


      </div>

   </header>





   <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
   <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
